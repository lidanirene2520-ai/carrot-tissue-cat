<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>萝卜纸巾猫</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="title">萝卜纸巾猫</div>
        <div class="stats">
          <div class="stat"><span class="label">分数</span><span id="score" class="value">0</span></div>
          <div class="stat"><span class="label">生命</span><span id="lives" class="value">3</span></div>
          <div class="stat"><span class="label">最高</span><span id="best" class="value">0</span></div>
        </div>
      </header>

      <section class="stage">
        <canvas id="canvas" width="480" height="720" aria-label="游戏画布"></canvas>
        <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
          <div class="card">
            <div class="card-title" id="overlayTitle">开始游戏</div>
            <div class="card-body" id="overlayBody">
              你是一只小猫：接住🥕加分，碰到🧻掉生命。<br />
              方向键或 WASD 移动；触屏：按住拖动移动。
            </div>
            <div class="card-actions">
              <button id="btnStart" class="btn primary" type="button">开始</button>
              <button id="btnAgain" class="btn" type="button">再来一局</button>
            </div>
          </div>
        </div>
      </section>

      <footer class="footer">
        <span>方向键 / WASD</span>
        <span class="sep">·</span>
        <span>触屏拖动</span>
        <span class="sep">·</span>
        <button id="btnPause" class="linkbtn" type="button">暂停</button>
        <span class="sep">·</span>
        <button id="btnResetBest" class="linkbtn" type="button">清空最高分</button>
      </footer>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
